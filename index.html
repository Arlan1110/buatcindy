<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hai My Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.4/dist/sweetalert2.all.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <style>
      * {
        padding: 0;
        margin: 0;
        font-family: "Roboto", sans-serif;
      }
      body {
        background: #121212;
        position: fixed;
        overflow: hidden;
      }
      .loading {
        width: 59vh;
        margin-left: 50vw;
        transform: translateX(-29.5vh);
        height: 100%;
        position: fixed;
        top: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        background: #121212;
      }
      .loading .content {
        text-align: center;
        font-weight: 500;
        color: white;
        font-size: 1.1em;
      }
      .loading img {
        width: 60px;
      }
      .background1 {
        height: 100vh;
        width: 59vh;
        margin: auto;
        position: absolute;
        top: 0;
        left: calc(50vw - 29.5vh);
        background-color: #121212;
        background-image: url("https://i.ibb.co.com/GYXXCRc/IMG-20251018-173019.jpg");
        background-size: cover;
        filter: brightness(70%);
      }
      .background2 {
        margin: auto;
        width: 59vh;
        height: 100vh;
        position: absolute;
        top: 0;
        left: calc(50vw - 29.5vh);
        background-color: #c93434;
        background-image: url("https://i.ibb.co.com/cSQHR1zB/54b9930a-f3d8-49fc-bb49-6fa663bdf828.jpg");
        background-size: cover;
        filter: brightness(70%);
        animation: bgchange 10s infinite linear;
      }
      @keyframes bgchange {
        0% { filter: brightness(70%) hue-rotate(0deg); }
        50% { filter: brightness(85%) hue-rotate(40deg); }
        100% { filter: brightness(70%) hue-rotate(0deg); }
      }
      .copyright {
        text-decoration: none;
        position: fixed;
        bottom: 10px;
        width: 120px;
        margin-left: 50vw;
        transform: translateX(-60px);
        display: flex;
        justify-content: space-around;
        align-items: center;
        color: white;
        z-index: 99;
        opacity: 0.5;
      }
      .main {
        position: absolute;
        top: 0;
        width: 100vw;
        height: 100vh;
      }
      .main .content {
        overflow-x: hidden;
        width: 59vh;
        margin: auto;
      }
      .main .content .jam h1 {
        color: white;
        font-weight: 100;
        font-size: 4.3em;
        text-align: center;
        margin-top: 120px;
      }
      .main .content .tanggal {
        display: flex;
        justify-content: center;
        color: white;
        margin: 0px 0 20px 0;
        font-size: 1.2em;
      }
      .main .content .notif {
        background: rgba(231, 231, 231, 0.6);
        width: 88%;
        padding: 15px;
        margin: 10px auto;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.801);
        cursor: pointer;
        transform: translateX(-100vw);
        transition: 300ms all ease;
      }
      .main .content .notif .header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: rgb(65, 65, 65);
        margin-bottom: 5px;
      }
      .main .content .notif .header .wa {
        display: flex;
        align-items: center;
      }
      .main .content .notif .header .wa h3 {
        margin-right: 6px;
        font-weight: 400;
        font-size: 0.9em;
      }
      .main .content .notif .header .wa h3 .logo {
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: linear-gradient(190deg, #72e587, #23a542);
        color: white;
        width: 23px;
        height: 23px;
        border-radius: 6px;
        font-size: 1.3em;
      }
      .main .content .notif .header .time {
        font-size: 0.9em;
      }
      .main .content .notif .nama {
        font-weight: 500;
        font-size: 1.1em;
      }
      .btn-mulai {
        position: absolute;
        color: rgb(0, 0, 0);
        bottom: 150px;
        right: 0;
        left: 0;
        text-align: center;
      }
      .btn-mulai p {
        background: rgba(231, 231, 231, 0.788);
        color: rgb(36, 36, 36);
        padding: 5px 10px;
        border-radius: 10px;
        display: inline-block;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        animation: goyang 1200ms infinite ease;
        box-shadow: 1px 1px 10px rgb(0, 0, 0);
      }
      .btn-mulai p.hilang2 { display: none; }
      .btn-mulai p.kirimWA { display: none; color: white; background: #23a542; }
      @keyframes goyang {
        0% { transform: translateY(0); }
        50% { transform: translateY(5px); }
        100% { transform: translateY(0); }
      }
      .kelip {
        animation: kelip 2000ms infinite ease;
      }
      @keyframes kelip {
        0% { opacity: 0.5; }
        50% { opacity: 0.9; }
        100% { opacity: 0.5; }
      }
      @media screen and (max-width: 600px) {
        .background1, .background2 { width: 100vw; left: 0; }
        .main .content { width: 100%; }
        .loading { width: 100%; margin-left: 0; transform: none; }
      }
      .border-radius { border-radius: 15px !important; }

      /* 💖 Efek hujan love */
      .heart {
        position: fixed;
        top: -10px;
        color: rgba(255, 0, 100, 0.8);
        animation: fall 5s linear infinite;
        z-index: 99;
        pointer-events: none;
      }
      @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
      }
      /* 💥 Pop click effect */
      @keyframes pop {
        0% { transform: scale(0) translateY(0); opacity: 1; }
        50% { transform: scale(1.5) translateY(-30px); }
        100% { transform: scale(0) translateY(-60px); opacity: 0; }
      }
    </style>
  </head>

  <body onload="startTime()">
    <div class="loading">
      <div class="content">Loading...</div>
    </div>

    <audio class="audio" src="https://c.top4top.io/m_3041ex7cy1.mp3" autoplay loop></audio>
    <audio class="notif" src="https://dekatutorial.github.io/notif.mp3"></audio>
    <audio class="popSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c9b8b2d1eb.mp3?filename=pop-94319.mp3"></audio>

    <div class="background1"></div>
    <div class="background2"></div>

    <div class="main">
      <div class="content">
        <div class="jam"><h1 id="jam">00:00</h1></div>
        <div class="tanggal"><p class="tgl">Sunday, 22 January</p></div>

        <div class="notif notif1 kelip" onclick="balas()">
          <div class="header">
            <div class="wa">
              <h3><i class="material-icons-sharp logo"> whatsapp </i></h3>
              <h3>WHATSAPP</h3>
            </div>
            <div class="time"><p>Now</p></div>
          </div>
          <div class="nama nama1"><p>Arlnd</p></div>
          <div class="isi"><p>malam cantik minta waktunya sebentar yaa!!</p></div>
        </div>

        <div class="notif notif2">
          <div class="header">
            <div class="wa">
              <h3><i class="material-icons-sharp logo"> whatsapp </i></h3>
              <h3>WHATSAPP</h3>
            </div>
            <div class="time"><p>Now</p></div>
          </div>
          <div class="nama nama2"><p>Your Love</p></div>
          <div class="isi"><p class="gombal"></p></div>
        </div>

        <div class="btn-mulai">
          <p class="hilang1" onclick="notif1()">Pencet Aku</p>
          <p class="hilang2">Buka Pesannya</p>
          <p class="kirimWA">Kirim Pesan Whatsapp</p>
        </div>
      </div>
    </div>

    <a href="https://www.youtube.com/arland" class="copyright">
      <p><i class="material-icons-sharp"> copyright </i></p>
      <p>ArlnD</p>
    </a>

    <script>
      var pengirim = "arlnd";
      var ucapan = " Terima kasih ya 🤍.Aku senang banget bisa bareng kamu cewek cantik dengan tahi lalat di hidung yang bikin kamu kelihatan unik dan lucu 😚.Masih kuingat waktu pertama kali aku berani genggam tanganmu 🤲, grogi parah tapi bahagia banget..Dunia rasanya berhenti sejenak waktu itu cuma ada kamu dan senyum malu-malumu 😊. Aku gak tahu kenapa, tapi tiap momen bareng kamu selalu terasa ringan dan hangat 🌤️. Ngobrol hal kecil aja bisa bikin aku ketawa tanpa sadar 😂. Dan kalau boleh jujur…Aku gak mau hari-hari kayak gitu hilang.Aku ingin hari-hari bersamamu jadi napas yang terus hidup dari detik ini, sampai detik terakhirku di dunia ini 💗🌹"
      var audio = document.querySelector(".audio");
      var notif = document.querySelector(".notif");
      var popSound = document.querySelector(".popSound");

      $(window).on("load", function () {
        $(".loading").fadeOut("slow");
      });

      function tanggal() {
        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const d = new Date();
        let hari = days[d.getDay()];
        let tgl = d.getDate();
        let bln = months[d.getMonth()];
        document.querySelector(".tgl").innerHTML = hari + ", " + tgl + " " + bln;
      }

      function notif1() {
        document.querySelector(".hilang1").style.display = "none";
        document.querySelector(".hilang2").style.display = "inline-block";
        audio.play();
        popSound.play();
        document.querySelector(".notif1").style.transform = "translateX(0)";
      }

      const swalo = Swal.mixin({
        confirmButtonColor: "#23a542",
        allowOutsideClick: false,
        showCancelButton: false,
        customClass: { popup: "border-radius" },
      });

      async function balas() {
        var { value: jawaban } = await swalo.fire({
          imageUrl: "https://dekatutorial.github.io/stiker_mylove.gif",
          imageHeight: 120,
          title: "Sebelum lanjut kamu ketik 'siap kapten' 🚀",
          input: "text",
          confirmButtonText: "Kirim 💬",
        });

        if (jawaban && jawaban.toLowerCase() === "siap kapten") {
          await swalo.fire({
            imageUrl: "https://i.ibb.co/rRh5CD80/dinosaur-dance.gif",
            imageHeight: 120,
            title: "Hehehe maaf baru jadi kamu  udah nungguin ya 😝",
            confirmButtonText: "Lanjutkan 💌",
          });
          document.querySelector(".hilang2").style.display = "none";
          txt = "Hehehe mantap, aku mau kamu baca ini!!! " + ucapan;
          typeWriter();
          notif2();
        } else {
          await swalo.fire({
            imageUrl: "https://dekatutorial.github.io/stiker2_mylove.gif",
            imageHeight: 120,
            confirmButtonText: "Oke deh 😘",
            title: "Ketik yang benar beib 😚",
          });
          balas();
        }
      }

      function notif2() {
        notif.play();
        document.querySelector(".notif1").style.display = "none";
        document.querySelector(".notif2").style.transform = "translateX(0)";
      }

      var i = 0;
      var speed = 120;
      function typeWriter() {
        if (i < txt.length) {
          document.querySelector(".gombal").innerHTML += txt.charAt(i);
          i++;
          setTimeout(typeWriter, speed);
        } else {
          document.querySelector(".notif2").style.animation = "kelip 1200ms infinite ease";
          document.querySelector(".background2").style.opacity = "0.3";
          startLoveRain();
          setTimeout(() => {
            swalo.fire({
              imageUrl: "https://i.ibb.co/ZzjFZY3H/nailong-yellow-dragon.gif",
              imageHeight: 130,
              title: "gimana suka g ? 😜",
              text: "Hehehe jangan senyum-senyum sendiri deh 💕",
              confirmButtonText: "Hehehe iya 😚",
            });
          }, 3000);
        }
      }

      // 💖 Efek hujan love
      function startLoveRain() {
        const body = document.querySelector("body");
        setInterval(() => {
          let heart = document.createElement("div");
          heart.classList.add("heart");
          heart.innerHTML = "&#10084;";
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.animationDuration = 2 + Math.random() * 3 + "s";
          heart.style.opacity = 0.5 + Math.random() * 0.5;
          heart.style.fontSize = 15 + Math.random() * 25 + "px";
          body.appendChild(heart);
          setTimeout(() => heart.remove(), 5000);
        }, 300);
      }

      // 💥 Klik efek pop hati
      document.body.addEventListener("click", function (e) {
        let pop = document.createElement("div");
        pop.innerHTML = "💖";
        pop.style.position = "absolute";
        pop.style.left = e.clientX + "px";
        pop.style.top = e.clientY + "px";
        pop.style.fontSize = "20px";
        pop.style.animation = "pop 1s ease-out forwards";
        document.body.appendChild(pop);
        setTimeout(() => pop.remove(), 1000);
      });

      function startTime() {
        tanggal();
        const today = new Date();
        let h = today.getHours();
        let m = today.getMinutes();
        h = checkTime(h);
        m = checkTime(m);
        document.getElementById("jam").innerHTML = h + ":" + m;
        setTimeout(startTime, 1000);
      }

      function checkTime(i) {
        if (i < 10) i = "0" + i;
        return i;
      }
    </script>
  </body>
</html>
